# =============================================================================
# pytest.ini — Pytest configuration for the fraud detection test suite.
# =============================================================================

[pytest]
# Discover tests in the tests/ subdirectory
testpaths = tests

# Only consider files matching this pattern as test modules
python_files = test_*.py

# Only consider classes matching this pattern as test classes
python_classes = Test*

# Only consider functions matching this pattern as test functions
python_functions = test_*

# Show short test summary info for all except passed
# -v for verbose output with each test listed
addopts = -v --tb=short
