// =============================================================================
// build.gradle — Cluster Controller
//
// This is the build configuration for the Cluster Controller microservice.
// It is responsible for:
//   1. Compiling .proto files into Java gRPC stubs (auto-generated networking code).
//   2. Pulling in the gRPC Spring Boot starter so our service "talks" gRPC.
//   3. Pulling in Spring Data Redis so we can broadcast config changes to workers.
//
// HOW GRPC CODE GENERATION WORKS:
//   When you run `./gradlew build`, the Protobuf Gradle plugin reads every
//   .proto file inside src/main/proto/ and generates Java classes into
//   build/generated/source/proto/. These generated classes contain:
//     - "Message" classes (like ScaleRequest, ScaleResponse) — simple data holders.
//     - "Service" base classes (like ClusterServiceGrpc.ClusterServiceImplBase)
//       that we extend to write our actual business logic.
// =============================================================================

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'

	// This plugin knows how to read .proto files and turn them into Java code.
	// Think of it like a "translator" that converts the Protobuf language into Java.
	id 'com.google.protobuf' version '0.9.4'
}

group = 'com.frauddetection'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// This is the version of the gRPC library we'll use everywhere.
// We define it once here so every gRPC dependency uses the exact same version.
// Mismatched versions cause extremely confusing runtime errors.
ext {
	grpcVersion = '1.63.0'
	// IMPORTANT: protoc 4.x generates code that requires protobuf-java 4.x at runtime,
	// but grpc-server-spring-boot-starter:3.1.0 bundles protobuf-java 3.x.
	// Using protoc 3.25.5 (the latest 3.x release) ensures the generated code
	// is compatible with the runtime library that ships with the starter.
	protocVersion = '3.25.5'
}

dependencies {
	// --- gRPC Dependencies ---

	// grpc-server-spring-boot-starter: This is the "magic glue" that connects
	// gRPC to Spring Boot. It automatically starts a gRPC server when your
	// Spring app boots up, and lets you use @GrpcService (like @RestController
	// but for gRPC). It handles all the low-level networking for you.
	implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'

	// grpc-protobuf: Allows gRPC to understand Protobuf messages.
	// Protobuf is the "language" that gRPC uses to serialize data (like JSON
	// but binary and much faster).
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"

	// grpc-stub: Provides the base classes that our generated code extends.
	// When Gradle auto-generates Java from .proto files, those generated
	// classes need this library to function.
	implementation "io.grpc:grpc-stub:${grpcVersion}"

	// jakarta.annotation-api: Required because the generated gRPC code uses
	// @Generated annotations. Since Spring Boot 3+ uses Jakarta (not javax),
	// we need this specific version.
	implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

	// Java 9+ removed javax.annotation. The gRPC plugin still generates
	// @javax.annotation.Generated for backward compatibility. We add this
	// as "compileOnly" so the code compiles, but it isn't bundled at runtime.
	compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

	// --- Spring Dependencies ---

	// Spring Data Redis: Gives us a RedisTemplate to publish messages.
	// We use Redis Pub/Sub to broadcast simulation config changes to all
	// Python producer containers simultaneously, without them needing to
	// poll or restart.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Jackson Databind: Converts Java Maps/Objects into JSON strings.
	// Used by SimulationConfigPublisher to serialize config payloads
	// before publishing them to Redis.
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// --- Test Dependencies ---

	// Spring Boot Test: @SpringBootTest, assertions, mock support.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// JUnit Platform Launcher: Required by Gradle to discover and run JUnit 5 tests.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// =============================================================================
// Protobuf Plugin Configuration
//
// This section tells the protobuf plugin:
//   1. WHERE to find the protoc compiler (the program that reads .proto files).
//   2. WHERE to find the gRPC Java plugin (generates the service base classes).
//   3. HOW to run the generation (apply the grpc plugin to all proto tasks).
// =============================================================================
protobuf {
	// protoc is the "Protocol Buffer Compiler" — a command-line tool made by
	// Google that reads .proto files and outputs code in your target language.
	// We tell Gradle to automatically download this tool from Maven Central.
	protoc {
		artifact = "com.google.protobuf:protoc:${protocVersion}"
	}

	// Plugins extend what protoc can generate. The default protoc only generates
	// the "message" classes (data holders). This grpc plugin adds the generation
	// of "service" base classes (the networking stubs we extend).
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}

	// This tells Gradle: "For every .proto file you find, run BOTH the default
	// protoc generator AND the grpc plugin." Without this, you'd only get
	// message classes but no service stubs.
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
	}
}

// Tell the Java compiler and your IDE where to find the auto-generated code.
// Without this, your IDE would show red squiggly lines on all the generated
// classes even though the code compiles fine.
sourceSets {
	main {
		java {
			srcDirs 'build/generated/source/proto/main/grpc'
			srcDirs 'build/generated/source/proto/main/java'
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Show individual test results in the terminal (like pytest -v)
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
		exceptionFormat = "full"
	}
}
