# =============================================================================
# nginx.conf — Nginx configuration for the Fraud Detection Dashboard.
#
# This config does two things:
#
# 1. SERVES THE REACT SPA:
#    All requests that don't match a static file are redirected to index.html.
#    This is required because React Router (if we add it later) handles
#    routing client-side. Without this, refreshing on /dashboard/alerts
#    would return a 404 from nginx.
#
# 2. PROXIES API CALLS TO THE SSE BACKEND:
#    Requests to /api/* are forwarded to the sse-stream container on port 8085.
#    This is the production equivalent of Vite's dev proxy.
#
#    The proxy_buffering=off directive is CRITICAL for SSE. Without it,
#    nginx would buffer the response and only send it when the buffer is
#    full — which defeats the purpose of real-time streaming. With buffering
#    off, each SSE event is forwarded to the browser immediately.
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # --- Serve static files (the built React app) ---
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: if the requested file doesn't exist,
        # serve index.html and let React handle the routing.
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy API requests to the API Gateway ---
    location /api/ {
        # Forward to the api-gateway container on the Docker network.
        # "api-gateway" is the container_name defined in docker-compose.yml.
        proxy_pass http://api-gateway:8090;

        # Required headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # --- SSE-specific settings ---
        # CRITICAL: Disable buffering so SSE events are streamed immediately.
        # Without this, nginx holds events in a buffer and the browser
        # receives them in delayed batches instead of real-time.
        proxy_buffering off;
        proxy_cache off;

        # Keep the connection open for SSE (default nginx timeout is 60s).
        # SSE connections are meant to stay open indefinitely.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Required for SSE: don't add chunked transfer encoding
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --- Gzip compression for faster asset delivery ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
