# =============================================================================
# docker-compose.yml — Fully containerised fraud detection pipeline.
#
# Services overview:
#
#   Messaging:
#     kafka            — Message broker (KRaft mode, no Zookeeper)
#     kafka-ui         — Web UI for browsing Kafka topics and messages
#
#   State store:
#     redis            — In-memory state store + RedisInsight UI
#     redis-commander  — Web UI for browsing Redis keys and values
#
#   Application:
#     producer         — Simulated transaction generator (Python)
#     fraud-detector   — Fraud evaluation engine (Python)
#     alert-consumer   — Alert display / forwarding service (Python)
#
#   Monitoring:
#     prometheus       — Metrics collection (scrapes /metrics endpoints)
#     grafana          — Dashboards and alerting on top of Prometheus
#     redis-exporter   — Translates Redis INFO into Prometheus format
#
# Port map:
#   Host-exposed (browser access):
#     8001:8001  — RedisInsight UI (built into redis-stack)
#     8080:8080  — Kafka UI
#     8081:8081  — Redis Commander UI
#     9090:9090  — Prometheus UI
#     3000:3000  — Grafana UI  (login: admin / admin)
#
#   Internal only (Docker network, not exposed to host):
#     9092  — Kafka PLAINTEXT listener (container-to-container)
#     9093  — Kafka CONTROLLER listener (KRaft internal)
#     6379  — Redis data
#     8000  — Producer Prometheus metrics
#     8002  — Fraud detector Prometheus metrics
#     8003  — Alert consumer Prometheus metrics
#     9121  — Redis exporter Prometheus metrics
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Kafka — single-node broker running in KRaft mode (no Zookeeper needed).
  # PLAINTEXT is for container-to-container, EXTERNAL is for host access.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    expose:
      - "9092"                          # PLAINTEXT listener (container-to-container)
      - "9093"                          # CONTROLLER listener (KRaft internal)
    environment:
      - KAFKA_NODE_ID=1                 # unique broker ID
      - KAFKA_PROCESS_ROLES=broker,controller  # combined mode (single node)
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1    # 1 broker → factor must be 1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0    # fast rebalance for dev
      - KAFKA_NUM_PARTITIONS=3                       # default partition count
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ---------------------------------------------------------------------------
  # Redis Stack — Redis server (port 6379) + RedisInsight UI (port 8001).
  # Used by the fraud detector to store per-user transaction state.
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    expose:
      - "6379"                          # Redis protocol (container-to-container)
    ports:
      - "8001:8001"                     # RedisInsight web UI
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Kafka UI — browse topics, partitions, consumer groups, and messages.
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=local-kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_READONLY=false

  # ---------------------------------------------------------------------------
  # Redis Commander — lightweight Redis key browser.
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOSTS=local:redis:6379

  # ---------------------------------------------------------------------------
  # Producer — generates synthetic transactions and sends them to Kafka.
  # Metrics exposed on port 8000.
  # ---------------------------------------------------------------------------
  producer:
    build: ./workers
    container_name: producer
    command: ["python", "-u", "producer.py"]    # -u: unbuffered stdout for logs
    expose:
      - "8000"                          # Prometheus metrics (scraped over Docker network)
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      fraud-detector:
        condition: service_started              # ensure consumer is up first
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Fraud Detector — consumes transactions, evaluates fraud rules using Redis,
  # and publishes alerts. Metrics exposed on port 8002.
  # ---------------------------------------------------------------------------
  fraud-detector:
    build: ./workers
    container_name: fraud-detector
    command: ["python", "-u", "fraud_detector.py"]
    expose:
      - "8002"                          # Prometheus metrics (scraped over Docker network)
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Alert Consumer — reads fraud alerts and prints them. In production this
  # would forward to Slack, PagerDuty, etc. Metrics on port 8003.
  # ---------------------------------------------------------------------------
  alert-consumer:
    build: ./workers
    container_name: alert-consumer
    command: ["python", "-u", "alert_consumer.py"]
    expose:
      - "8003"                          # Prometheus metrics (scraped over Docker network)
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes /metrics endpoints from the Python apps and
  # redis-exporter, storing time-series data for Grafana queries.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"                     # Prometheus web UI + API
    volumes:
      # Mount our scrape config into the container
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      redis-exporter:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Grafana — visualisation dashboards on top of Prometheus data.
  # Login: admin / admin (change on first login, or skip).
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"                     # Grafana web UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Auto-provision the Prometheus datasource (no manual setup needed)
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Auto-provision dashboard definitions
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Mount the actual dashboard JSON files
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Redis Exporter — reads Redis INFO/metrics and exposes them in Prometheus
  # format on port 9121 (scraped by the Prometheus "redis" job).
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    expose:
      - "9121"                          # Prometheus metrics (scraped over Docker network)
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

networks:
  default:
    name: fraud-detection-net
