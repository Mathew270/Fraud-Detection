# =============================================================================
# CI — Continuous Integration for the Fraud Detection pipeline.
#
# Triggers on every push and pull request to main. Runs:
#   1. Python tests       — pytest unit & integration tests (workers/)
#   2. Python syntax check — ensures all worker modules load without errors
#   3. Java tests          — Gradle build + JUnit tests (dashboard_api/)
#   4. Docker builds       — verifies both worker and API images build
#   5. Compose validation  — checks docker-compose.yml is well-formed
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Python Tests — unit + integration tests using pytest and fakeredis
  # ---------------------------------------------------------------------------
  python-test:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r workers/requirements.txt
          pip install -r workers/requirements-test.txt

      - name: Run tests
        working-directory: workers
        run: pytest --tb=short -v

  # ---------------------------------------------------------------------------
  # Python Syntax Check — catch broken imports or syntax errors early
  # ---------------------------------------------------------------------------
  python-syntax:
    name: Python Syntax & Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r workers/requirements.txt

      - name: Compile all worker modules
        run: python -m py_compile workers/config.py workers/producer.py workers/fraud_detector.py workers/alert_consumer.py workers/transaction_generator.py

  # ---------------------------------------------------------------------------
  # Java Tests — Gradle build + JUnit tests for the Dashboard API
  # ---------------------------------------------------------------------------
  java-test:
    name: Java Tests (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: dashboard_api
        run: ./gradlew build

  # ---------------------------------------------------------------------------
  # Docker Builds — verify both application images build successfully
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build workers image
        run: docker build -t fraud-detection-workers ./workers

      - name: Build dashboard-api image
        run: docker build -t fraud-detection-dashboard-api ./dashboard_api

  # ---------------------------------------------------------------------------
  # Compose Validation — ensure docker-compose.yml is well-formed
  # ---------------------------------------------------------------------------
  compose-check:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
