plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.4'
}

group = 'com.frauddetection'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	springCloudVersion = '2025.1.2'
	grpcVersion = '1.63.0'
	protocVersion = '3.25.5'
}

dependencies {
	// Spring Cloud Gateway (Reactive)
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux:5.0.2'

	// gRPC Client Starter
	implementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'

	// gRPC dependencies
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "io.grpc:grpc-netty:${grpcVersion}"
	implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

	// Spring WebFlux for reactive endpoints / gateway core
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protocVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs 'build/generated/source/proto/main/grpc'
			srcDirs 'build/generated/source/proto/main/java'
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
		exceptionFormat = "full"
	}
}
